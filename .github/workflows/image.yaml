# Builds the image from a version tag and pushes it to Halvic's Harbor, where the halviclabs cluster pulls it from.
# A tag vX.Y.Z publishes harbor.halviclabs.ch/alvireq/invoiceninja-mcp:X.Y.Z once: the version must match
# package.json, and a version that is already published is refused (Harbor's tag-immutability rule refuses it too).
# Secrets: HARBOR_USERNAME and HARBOR_PASSWORD of a robot account limited to the Harbor project alvireq
# (the ALVIREQ Console's deploy/bootstrap/2.3a-harbor.sh creates it).
name: Image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: harbor.halviclabs.ch/alvireq/invoiceninja-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(node -p "require('./package.json').version")"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $expected."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: harbor.halviclabs.ch
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Refuse a version that is already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION is already published. Tag a new version instead."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
