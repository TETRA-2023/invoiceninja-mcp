name: CI

# MCP-server family checks (TETRA-2023 standard, US-17 #3170): secrets, lint, test, docker.
# Public repo, so GitHub-hosted runners (org rule: runner follows repo visibility).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repo (full history)
        run: gitleaks detect --no-banner --redact --verbose

  # No linter or formatter upstream yet: `lint` is the type check, so the job keeps the
  # family's required-check name.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    needs: [secrets, lint, test]
    runs-on: ubuntu-latest
    env:
      SMOKE_NAME: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the REAL image through its entrypoint and transport, then initialize + tools/list.
      # Dummy credentials: tools/list never calls Invoice Ninja, and --network none keeps CI
      # away from any real instance. The script is piped on stdin (no bind mount).
      - name: Smoke test image (initialize + tools/list)
        run: |
          docker run -d --network none --name "$SMOKE_NAME" \
            -e INVOICE_NINJA_URL=http://127.0.0.1:9 \
            -e INVOICE_NINJA_TOKEN=ci \
            -e HOST=0.0.0.0 \
            -e PORT=8000 \
            -e MCP_BEARER_TOKEN=ci-token \
            mcp-smoke:ci
          docker run --rm -i --network "container:$SMOKE_NAME" python:3.12-alpine \
            python - http http://127.0.0.1:8000/mcp --bearer ci-token --wait 60 \
            < scripts/ci/mcp-smoke.py
        timeout-minutes: 3

      - name: Smoke test logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 "$SMOKE_NAME" 2>&1 || true
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true

  # image.yml is a byte-identical copy of TETRA-2023/ci-workflows' image.yml (Taiga #2927).
  # Pushes `main` and `sha-<7>`, never `latest`, and only if the smoke test passes.
  # Deployments pin the digest.
  publish:
    needs: [secrets, lint, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: ghcr.io/tetra-2023/invoiceninja-mcp
      registry: ghcr.io
      registry-username: ${{ github.actor }}
      mode: branch
      ref: ${{ github.sha }}
      branch: main
      runs-on: ubuntu-latest
      smoke-command: |
        docker run -d --network none --name "$SMOKE_NAME" \
          -e INVOICE_NINJA_URL=http://127.0.0.1:9 \
          -e INVOICE_NINJA_TOKEN=ci \
          -e HOST=0.0.0.0 \
          -e PORT=8000 \
          -e MCP_BEARER_TOKEN=ci-token \
          "$SMOKE_IMAGE"
        docker run --rm -i --network "container:$SMOKE_NAME" python:3.12-alpine \
          python - http http://127.0.0.1:8000/mcp --bearer ci-token --wait 60 \
          < "$SMOKE_TOOLS/scripts/ci/mcp-smoke.py"

  # Tag only (Taiga T25.6 #3576, decision 5 of EPIC #2866): semantic-release tags
  # vX.Y.Z and creates the GitHub Release with the tetra-release App, nothing is
  # committed to main. The tag (pushed by the App, not GITHUB_TOKEN) triggers
  # release-image.yml. Only the App may create v* tags (org ruleset
  # org-release-tags). Same model as umami-mcp (Node).
  release:
    needs: [secrets, lint, test, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: release
    permissions:
      contents: read

    steps:
      # contents:write only: the github plugin's issue/PR comments and labels
      # are turned off in .releaserc.json, so no issues/pull-requests scope.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # semantic-release 25 needs ^22.14 || >=24.10
          cache: npm

      - run: npm ci

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
