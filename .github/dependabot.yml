# Dependabot configuration.
#
# - npm: security + version-update PRs for the deps in package-lock.json.
# - github-actions: keeps the action pins in .github/workflows current.
#
# These are first-party TETRA repos, so PRs are mergeable as-is after CI.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # Runtime deps -> fix(deps): a security/runtime bump cuts a patch release.
      # Dev/tooling deps -> chore(deps-dev): no release.
      prefix: "fix"
      prefix-development: "chore"
      # include: scope -> "fix(deps): ..." / "chore(deps-dev): ..." (US-7 #2938).
      include: "scope"
    ignore:
      # @types/node follows the RUNTIME major (node:24 in the Dockerfile, Node
      # 24 in CI), not the latest Node: a newer major types APIs Node 24 does
      # not have. Raise both together. A version range, not update-types, so
      # security updates are held too (ci-workflows README).
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      # Action pins are CI-only: "ci(deps): ..." never cuts a release (US-7 #2938).
      prefix: "ci"
      include: "scope"
